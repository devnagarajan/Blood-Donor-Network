{% extends 'base.html' %}

{% block title %}Reset Password - RedFusion{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <div style="font-size: 4rem; margin-bottom: 1rem;">🔑</div>
                        <h2>Reset Password</h2>
                        <p class="text-muted">Enter your email address and we'll send you a link to reset your password.</p>
                    </div>
                    
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text">✉️</span>
                                <input type="email" class="form-control" id="email" name="email" required autofocus placeholder="your.email@example.com">
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-danger w-100 mb-3">
                            Send Reset Link
                        </button>
                        
                        <div class="text-center">
                            <p class="mb-0">Remember your password? 
                                <a href="{% url 'core:home' %}" class="text-danger">Back to Login</a>
                            </p>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
