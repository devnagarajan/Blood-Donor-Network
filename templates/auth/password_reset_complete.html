{% extends 'base.html' %}

{% block title %}Password Reset Complete - RedFusion{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-5 text-center">
                    <div style="font-size: 5rem; margin-bottom: 1rem;">🎉</div>
                    <h2 class="mb-4">Password Reset Complete!</h2>
                    <p class="text-muted mb-4">
                        Your password has been successfully reset. 
                        You can now login with your new password.
                    </p>
                    <div class="d-flex gap-3 justify-content-center">
                        <a href="{% url 'donors:login' %}" class="btn btn-danger">
                            Login as Donor
                        </a>
                        <a href="{% url 'hospitals:login' %}" class="btn btn-primary">
                            Login as Hospital
                        </a>
                        <a href="{% url 'ngos:login' %}" class="btn btn-success">
                            Login as NGO
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
